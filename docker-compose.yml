services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduitai
    ports:
      - "5432:5432"
    volumes:
      - conduit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduitai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://conduit:conduit@db:5432/conduitai
      ENVIRONMENT: development
      MOCK_CRM_BASE_URL: http://mock-crm:8100
      MOCK_CRM_API_TOKEN: mock-crm-demo-token
    depends_on:
      db:
        condition: service_healthy
      mock-crm:
        condition: service_started
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic
      - ./backend/reports:/code/reports

  mock-crm:
    build:
      context: ./mock-crm
    ports:
      - "8100:8100"
    environment:
      MOCK_CRM_API_TOKEN: mock-crm-demo-token

volumes:
  conduit_pgdata:
